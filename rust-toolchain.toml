# The exact compiler CI runs, not a moving channel: warnings are denied, so
# a Rust release has to arrive as a reviewable pull request rather than as
# an event nobody opened. Not the MSRV — that is `rust-version` in
# Cargo.toml. How to bump this: the Toolchain section of CONTRIBUTING.md,
# or CONTRIBUTING.ja.md for the Japanese copy.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
