# Without this file nothing proposes a bump for a SHA-pinned action, and a pin
# with nobody moving it is a pin that silently rots. Every third-party action
# in `.github/workflows/` is pinned to a commit (see #122), so this entry is
# what turns those pins from frozen into maintained: Dependabot reads the
# `# vX.Y.Z` comment beside each SHA, finds the newer release, and opens a PR
# that moves both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      # One PR a week rather than seven. A pinned action is only reviewable by
      # reading the diff between two SHAs, and doing that once beats doing it
      # per action.
      actions:
        patterns: ["*"]
