name: editors + website
on:
  push:
    branches: [main, canary]
    paths:
      - "editors/vscode/**"
      - "website/**"
      - "Cargo.toml"
      - ".github/workflows/editors-website.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "website/**"
      - "Cargo.toml"
      - ".github/workflows/editors-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - name: Compare the extension version with the workspace version
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(awk '
            /^\[workspace\.package\]/   { in_section = 1; next }
            /^\[/                       { in_section = 0 }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' ../../Cargo.toml)
          if [[ ! "$workspace" =~ ^[0-9]{4}\.(0|[1-9][0-9]*)(\.[0-9]+)?$ ]]; then
            echo "Read '$workspace' from [workspace.package]; that is not a CalVer number" >&2
            exit 1
          fi
          extension=$(jq -er '.version' package.json)
          echo "Cargo [workspace.package]: $workspace"
          echo "editors/vscode:            $extension"
          if [ "$workspace" != "$extension" ]; then
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check, bundle, and package
        run: pnpm run package

  website:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Three checks, none of which subsumes another. `astro check` type-checks
      # `astro.config.mjs` and everything under `src`, which the build does not
      # do at all. The build renders every page, so a content-collection
      # frontmatter violation and a sidebar `slug:` pointing at a missing page
      # fail there. Link validation runs as a build hook, after the pages
      # exist, and resolves every internal link and `#anchor` fragment in both
      # the `en` and `ja` trees — a relative link is refused outright, because
      # on this site a relative link is a broken link (see `astro.config.mjs`).
      - run: pnpm run check
      - run: pnpm run build
