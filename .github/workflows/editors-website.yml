name: editors + website
on:
  push:
    branches: [main, canary]
    paths:
      - "editors/vscode/**"
      - "website/**"
      - "Cargo.toml"
      - ".github/workflows/editors-website.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "website/**"
      - "Cargo.toml"
      - ".github/workflows/editors-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check, bundle, and package
        run: pnpm run package

  website:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # The build does not type-check, and `astro check` neither renders pages nor validates links.
      - run: pnpm run check
      - run: pnpm run build
