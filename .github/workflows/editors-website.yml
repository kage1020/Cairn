name: editors + website
on:
  push:
    branches: [main, canary]
    paths:
      - "editors/vscode/**"
      - "website/**"
      - "xtask/**"
      - "Cargo.toml"
      - ".github/workflows/editors-website.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "website/**"
      - "xtask/**"
      - "Cargo.toml"
      - ".github/workflows/editors-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check, bundle, and package
        run: pnpm run package

      - name: Read the VS Code version the tests pin
        id: vscode
        run: |
          version=$(grep -oP '^const VSCODE_VERSION = "\K[^"]+(?=";$)' src/test/extension.test.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code
        uses: actions/cache@v6
        with:
          path: editors/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.vscode.outputs.version }}

      - name: Start a stand-in cairn-lsp through the extension
        run: xvfb-run -a pnpm test

  website:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # The build does not type-check, and `astro check` neither renders pages nor validates links.
      - run: pnpm run check
      - run: pnpm run build

      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: website
          save-if: ${{ github.ref == 'refs/heads/canary' || github.ref == 'refs/heads/main' }}
      # `cairn docs` prints the pages cairn-lang-docs embeds, so they must be the ones just built.
      - name: Embedded pages match the build
        working-directory: .
        run: cargo xtask lint --site website/dist site-parity
