name: tree-sitter

# tree-sitter-specific gates for crates/cairn-lang-tree-sitter/. The crate's Rust
# tests are already covered by ci.yml's `cargo test --workspace` on every push/PR;
# this workflow only adds what ci.yml doesn't: version parity across the three
# manifests that carry the version, generated-file drift, the tree-sitter corpus
# (pnpm), the Node addon smoke build, what the published tarball actually
# contains, and the WASM release asset.
#
# The WASM asset is reachable two ways. A human pushing a `v*` tag fires the tag
# trigger below; release-plz cannot, because it pushes its tag with GITHUB_TOKEN
# and GitHub's recursion guard stops a token-made push from firing another
# workflow's `on: push: tags:`. release.yml therefore dispatches this workflow
# explicitly with the tag it just created, the same way it already does for
# publish.yml. Both paths converge on `resolve-ref`, the one place the tag is
# validated and turned into the ref every other job checks out.

on:
  # `Cargo.toml` is in the filter for the version-sync job's sake. The workspace
  # version lives there while the two copies it has to agree with live under the
  # crate, so a release PR that bumps only Cargo.toml is precisely the change
  # that can break parity — and, without this path, precisely the change that
  # would not run the job that checks it. That is not hypothetical: the release
  # PR for v2026.8.0 merged green and left the npm manifests a version behind.
  push:
    branches: [main, canary]
    tags: ["v*"]
    paths:
      - "crates/cairn-lang-tree-sitter/**"
      - "Cargo.toml"
      - ".github/workflows/tree-sitter.yml"
  pull_request:
    paths:
      - "crates/cairn-lang-tree-sitter/**"
      - "Cargo.toml"
      - ".github/workflows/tree-sitter.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the WASM release asset from (e.g. v2026.8.0)"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/cairn-lang-tree-sitter

jobs:
  resolve-ref:
    name: Resolve checkout ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # Nothing is checked out here, so the workflow-level working-directory
      # would point at a path that does not exist yet. Run at the workspace root.
      - id: resolve
        working-directory: .
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          # Branch pushes and pull requests release nothing: leave both outputs
          # empty so actions/checkout falls back to its own default ref and
          # wasm-build stays skipped.
          if [ -z "$RAW_TAG" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same CalVer gate publish.yml applies to its own tag input. Every
          # downstream job checks this value out and the release asset is
          # uploaded under it, so an unvalidated dispatch input must reach
          # neither. `v*` in the push filter is broad enough to let a malformed
          # tag through, so the check covers that path too.
          if [[ ! "$RAW_TAG" =~ ^v[0-9]{4}\.(0|[1-9][0-9]*)(\.[0-9]+)?$ ]]; then
            echo "Refusing to build untrusted tag: $RAW_TAG" >&2
            exit 1
          fi
          echo "ref=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

  version-sync:
    name: Version parity
    needs: resolve-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      # The crate's Cargo.toml says `version.workspace = true`, so the Rust side
      # of the version is whatever `[workspace.package]` holds. The npm package
      # and the tree-sitter manifest each carry their own copy, and release-plz
      # rewrites only Cargo.toml — it has no npm support. This job is what stops
      # the three from drifting apart after a CalVer bump; release.yml's "Set
      # workspace version" step is what keeps them moving together.
      - name: Compare the three version declarations
        shell: bash
        env:
          TAG: ${{ needs.resolve-ref.outputs.tag }}
        run: |
          set -euo pipefail
          workspace=$(awk '
            /^\[workspace\.package\]/   { in_section = 1; next }
            /^\[/                       { in_section = 0 }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' ../../Cargo.toml)
          if [ -z "$workspace" ]; then
            echo "Could not read version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          package=$(jq -er '.version' package.json)
          manifest=$(jq -er '.metadata.version' tree-sitter.json)
          echo "Cargo [workspace.package]: $workspace"
          echo "package.json:              $package"
          echo "tree-sitter.json:          $manifest"
          if [ "$workspace" != "$package" ] || [ "$workspace" != "$manifest" ]; then
            echo "Version declarations disagree. All three move together." >&2
            exit 1
          fi
          # On a release ref the tag is a fourth copy of the same number, and the
          # one the published artifacts are named after.
          if [ -n "$TAG" ] && [ "$workspace" != "${TAG#v}" ]; then
            echo "Tag $TAG does not match the declared version $workspace" >&2
            exit 1
          fi

  generate-check:
    name: Generate drift check
    needs: resolve-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/cairn-lang-tree-sitter/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/cairn-lang-tree-sitter/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate
      - name: Ensure generated files match commit
        run: git diff --exit-code src/parser.c src/grammar.json src/node-types.json

  tree-sitter-test:
    name: tree-sitter corpus
    needs: resolve-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/cairn-lang-tree-sitter/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/cairn-lang-tree-sitter/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p cairn-lang-tree-sitter

  node-smoke:
    name: Node addon smoke (${{ matrix.os }}, node ${{ matrix.node }})
    needs: resolve-ref
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 20 is intentionally excluded: node-gyp 13 depends on undici
        # APIs (webidl.util.markAsUncloneable) that only exist from Node 22+.
        # Node 20 is also being deprecated on GitHub Actions runners.
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/cairn-lang-tree-sitter/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: crates/cairn-lang-tree-sitter/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec node-gyp rebuild --release
      - run: node -e "console.log(require('./bindings/node').name)"

  packed-tarball:
    name: Packed tarball resolves .crn
    needs: resolve-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/cairn-lang-tree-sitter/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/cairn-lang-tree-sitter/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Everything below runs from $RUNNER_TEMP, outside the checkout, because
      # the question is what an editor gets after `npm install tree-sitter-cairn`
      # — and in the repository tree-sitter.json is on disk whether or not
      # package.json's `files` ships it, so a check that runs in-tree can only
      # ever pass. Since tree-sitter CLI 0.24 that file is the sole declaration
      # of `file-types` and the query paths; without it an editor finds no
      # language for `.crn` at all. `tree-sitter parse` does not answer the
      # question either: it falls back to src/grammar.json and works with the
      # manifest missing, so highlighting is what has to be exercised.
      - name: Highlight a .crn using only the packed files
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/packed"
          mkdir -p "$work/parsers"
          # npm rather than pnpm: npm-publish.yml mints the real tarball with
          # `npm publish`, so npm's file selection is the one under test.
          npm pack --pack-destination "$work"
          tar -xzf "$work"/tree-sitter-cairn-*.tgz -C "$work"
          # A parser directory is scanned for entries named `tree-sitter-*`;
          # npm unpacks to `package/`.
          mv "$work/package" "$work/parsers/tree-sitter-cairn"
          echo "Packed files:"
          find "$work/parsers/tree-sitter-cairn" -type f -printf '  %P\n' | sort
          cp "$GITHUB_WORKSPACE/examples/cottage.crn" "$work/sample.crn"
          printf '{"parser-directories":["%s/parsers"]}\n' "$work" > "$work/config.json"

          # Leaving the checkout is the whole point, and it has to happen before
          # the CLI runs, not just before the tarball is unpacked: the working
          # directory is searched for a grammar ahead of the configured parser
          # directories, so a run started from the crate resolves `.crn` through
          # the repository's own tree-sitter.json and passes no matter what the
          # tarball holds. Measured, not assumed — the check was vacuous until
          # this line was added.
          cd "$work"

          # An unresolved extension is a warning, not an error: the CLI exits 0
          # and writes nothing. The output is the discriminator, not the status,
          # so `|| true` here loses nothing an exit-code gate would have caught.
          ts="$GITHUB_WORKSPACE/crates/cairn-lang-tree-sitter/node_modules/.bin/tree-sitter"
          "$ts" highlight --config-path "$work/config.json" "$work/sample.crn" \
            > "$work/out.txt" 2> "$work/err.txt" || true
          cat "$work/err.txt" >&2
          if [ ! -s "$work/out.txt" ]; then
            echo 'The packed file set does not resolve .crn to the Cairn grammar.' >&2
            echo 'Every editor integration installing from npm sees the same thing.' >&2
            exit 1
          fi
          echo "Highlighted $(wc -c < "$work/out.txt") bytes from the packed grammar."

  wasm-build:
    name: WASM build (release asset)
    if: needs.resolve-ref.outputs.tag != ''
    needs: [resolve-ref, version-sync, generate-check, tree-sitter-test]
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release attaches the artifact to the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/cairn-lang-tree-sitter/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/cairn-lang-tree-sitter/pnpm-lock.yaml
      - uses: mymindstorm/setup-emsdk@v14
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tree-sitter build --wasm --output tree-sitter-cairn.wasm
      - name: Verify WASM artifact
        run: |
          test -s tree-sitter-cairn.wasm
          file tree-sitter-cairn.wasm | grep -q "WebAssembly"
      # tag_name is explicit because on the dispatch path github.ref points at a
      # branch, leaving the action with no tag to attach the asset to.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-ref.outputs.tag }}
          files: crates/cairn-lang-tree-sitter/tree-sitter-cairn.wasm
