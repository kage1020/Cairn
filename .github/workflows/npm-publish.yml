name: npm publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish from (e.g. v2026.8.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: crates/cairn-lang-tree-sitter

jobs:
  publish:
    name: Publish tree-sitter-cairn
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - id: validate
        name: Validate tag
        working-directory: .
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RAW_TAG" =~ ^v[0-9]{4}\.(0|[1-9][0-9]*)(\.[0-9]+)?$ ]]; then
            echo "Refusing to publish untrusted tag: $RAW_TAG" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.validate.outputs.tag }}

      - name: Ensure package.json matches the tag
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          declared=$(jq -er '.version' package.json)
          if [ "$declared" != "$VERSION" ]; then
            echo "package.json declares $declared but the tag says $VERSION" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: crates/cairn-lang-tree-sitter/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/cairn-lang-tree-sitter/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate
      - name: Ensure generated files match the tag
        run: git diff --exit-code src/parser.c src/grammar.json src/node-types.json
      - run: pnpm test

      # `actions/setup-node` with `node-version: 22` brings the npm Node 22
      # bundles, which is 10.x and carries no Trusted Publishing support at
      # all — so this upgrade is required, not cosmetic. Trusted Publishing
      # needs npm 11.5.1 or newer. The major is what carries the argument; the
      # patch moves with each v22 release and nothing here maintains it.
      #
      # Pinned rather than `@latest` because this is the binary that performs
      # the OIDC token exchange under the `id-token: write` granted above and
      # signs the provenance attestation: whoever controls what a floating tag
      # resolves to controls the publish. The one third-party action in this
      # job is SHA-pinned and the install is `--frozen-lockfile`; `actions/*`
      # stays on its major tag as the accepted risk `.github/dependabot.yml`
      # records. This line was the one moving target nothing had decided about.
      #
      # `.github/dependabot.yml` configures `github-actions` only, and no
      # ecosystem watches a version inside a `run:` line — nothing will raise
      # this for you. Bump it deliberately when Trusted Publishing needs a
      # newer npm, and re-run this workflow on a tag to prove it.
      #
      # Checked rather than trusted, because the pin is only worth the binary
      # that ends up on `PATH` and this workflow cannot be exercised from a
      # pull request: a self-check at runtime is the only thing that ever
      # tests it. `--engine-strict` turns an engine mismatch from an
      # `EBADENGINE` warning into a failure at the install, where it is
      # readable, rather than a failure later in some shape nobody can place.
      # Both land before the tarball is built and before a token is minted,
      # which is the direction to fail in. `hash -r` is what keeps the
      # comparison honest: bash hashed `npm` on the install line, and a stale
      # entry would report the version this step replaced and fail a publish
      # for no reason.
      - name: Install a Trusted-Publishing-capable npm
        shell: bash
        env:
          NPM_VERSION: "12.1.0"
        run: |
          set -euo pipefail
          npm install -g --engine-strict "npm@$NPM_VERSION"
          hash -r
          installed=$(npm --version)
          if [ "$installed" != "$NPM_VERSION" ]; then
            echo "npm $installed is on PATH, but this job pinned $NPM_VERSION" >&2
            exit 1
          fi

      - name: Ensure the tarball carries the tree-sitter manifest
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/tree-sitter-cairn-*.tgz)
          if ! tar -tzf "$tarball" | grep -qx 'package/tree-sitter.json'; then
            echo 'tree-sitter.json is not in the tarball: package.json files[] dropped it.' >&2
            echo 'Publishing it would ship a grammar no editor can resolve .crn to.' >&2
            exit 1
          fi

      - run: npm publish --access public --provenance
