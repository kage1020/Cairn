name: Minecraft

on:
  push:
    branches: [canary]
    paths:
      - "examples/**"
      - "crates/cairn-lang-core/src/**"
      - "crates/cairn-lang-nbt/src/**"
      - "crates/cairn-lang-formats/src/**"
      - "crates/cairn-lang-formats/registry-data/**"
      - "crates/cairn-lang-cli/src/**"
      - "Cargo.lock"
      - ".github/scripts/minecraft_load.py"
      - ".github/scripts/extract_registry.py"
      - ".github/workflows/minecraft.yml"
  pull_request:
    # Keep in step with the `push` filter.
    paths:
      - "examples/**"
      - "crates/cairn-lang-core/src/**"
      - "crates/cairn-lang-nbt/src/**"
      - "crates/cairn-lang-formats/src/**"
      - "crates/cairn-lang-formats/registry-data/**"
      - "crates/cairn-lang-cli/src/**"
      - "Cargo.lock"
      - ".github/scripts/minecraft_load.py"
      - ".github/scripts/extract_registry.py"
      - ".github/workflows/minecraft.yml"
  schedule:
    # Weekly, off the hour, for a change to Java 25 or to what Mojang and GeyserMC serve, which no
    # path above sees.
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  load:
    name: Examples load in Minecraft Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: minecraft
          save-if: ${{ github.ref == 'refs/heads/canary' }}

      - name: Restore the server jars
        id: jars
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/cairn-minecraft
          key: minecraft-${{ hashFiles('crates/cairn-lang-formats/registry-data/java/data_versions.json') }}
          # The script checks each jar against Mojang's SHA-1, so an older set is a safe start.
          restore-keys: minecraft-

      - name: Install Java
        # 26.3's server needs Java 25, which the older targets run on too.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Build cairn
        run: cargo build -p cairn-lang-cli --locked

      - name: Load the examples
        run: >-
          python3 .github/scripts/minecraft_load.py
          --cairn ./target/debug/cairn
          --java "$JAVA_HOME/bin/java"
          --cache ~/.cache/cairn-minecraft

      - name: Save the server jars
        if: github.ref == 'refs/heads/canary' && steps.jars.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/cairn-minecraft
          key: ${{ steps.jars.outputs.cache-primary-key }}

  tables:
    name: Registry tables match the game
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore the server jars, palettes and state maps
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/cairn-minecraft
          # The script pins the palettes and state maps, so a new pin needs a new key to be saved.
          key: minecraft-tables-${{ hashFiles('crates/cairn-lang-formats/registry-data/*/data_versions.json', '.github/scripts/extract_registry.py') }}
          # Not the load job's key, which saves no palette or state map. The script checks each file
          # against its published hash, so an older set, the load job's included, is a safe start.
          restore-keys: |
            minecraft-tables-
            minecraft-

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Java
        run: >-
          python3 .github/scripts/extract_registry.py java --check
          --java "$JAVA_HOME/bin/java"
          --cache ~/.cache/cairn-minecraft

      - name: Bedrock
        # A Java difference says nothing about Bedrock's tables. The state maps read the reports of
        # the Java releases GeyserMC's mappings follow.
        if: success() || failure()
        run: >-
          python3 .github/scripts/extract_registry.py bedrock --check
          --java "$JAVA_HOME/bin/java"
          --cache ~/.cache/cairn-minecraft

      - name: Save the server jars, palettes and state maps
        if: github.ref == 'refs/heads/canary' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/cairn-minecraft
          key: ${{ steps.downloads.outputs.cache-primary-key }}
