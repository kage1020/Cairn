name: Release

on:
  schedule:
    - cron: "17 4 1 * *"
  push:
    branches: [canary]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 2026.7.0). Leave empty to compute from tags."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compute-version:
    name: Compute next CalVer
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true

      - id: calc
        shell: bash
        env:
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            if [[ ! "$OVERRIDE" =~ ^[0-9]{4}\.(0|[1-9][0-9]*)(\.[0-9]+)?$ ]]; then
              echo "Refusing invalid override: $OVERRIDE" >&2
              exit 1
            fi
            echo "version=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using manual override: $OVERRIDE"
            exit 0
          fi
          year=$(date -u +%Y)
          month=$(date -u +%-m)
          prefix="v${year}.${month}"
          patches=$(git tag --list "${prefix}.*" | sed -E "s/^${prefix}\.//" | sort -n)
          if [ -z "$patches" ]; then
            version="${year}.${month}.0"
          else
            last=$(echo "$patches" | tail -n1)
            next=$((last + 1))
            version="${year}.${month}.${next}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed: $version"

  release-minor:
    name: Open monthly minor release PR
    if: github.event_name != 'push'
    needs: compute-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-minor
          save-if: ${{ github.ref == 'refs/heads/canary' }}

      - name: Set workspace version
        env:
          NEW_VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E '/^\[workspace\.package\]/,/^\[/ s/^version = ".*"/version = "'"$NEW_VERSION"'"/' Cargo.toml
          sed -i -E 's/^(cairn-[a-z-]+ = \{ version = )"[^"]*"/\1"'"$NEW_VERSION"'"/' Cargo.toml
          cargo update --workspace
          echo "--- Cargo.toml [workspace.package] + [workspace.dependencies] ---"
          awk '/^\[workspace\.(package|dependencies)\]/,/^$/' Cargo.toml

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/cairn-lang-tree-sitter/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/cairn-lang-tree-sitter/pnpm-lock.yaml

      # release-pr never publishes, so no crates.io token is needed here.
      - name: Run release-plz release-pr
        id: release_pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Align the non-Cargo manifests with the version release-plz chose
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          PR: ${{ steps.release_pr.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(jq -er '.head_branch' <<<"$PR")
          git fetch origin "$branch"
          git checkout -f -B "$branch" "origin/$branch"

          version=$(awk '
            /^\[workspace\.package\]/   { in_section = 1; next }
            /^\[/                       { in_section = 0 }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]{4}\.(0|[1-9][0-9]*)(\.[0-9]+)?$ ]]; then
            echo "Read '$version' from [workspace.package]; that is not a CalVer number" >&2
            exit 1
          fi
          echo "release-plz settled on $version"

          sed -i -E 's/^(cairn-[a-z-]+ = \{ version = )"[^"]*"/\1"'"$version"'"/' Cargo.toml

          for spec in \
            "crates/cairn-lang-tree-sitter/package.json:.version" \
            "crates/cairn-lang-tree-sitter/tree-sitter.json:.metadata.version" \
            "editors/vscode/package.json:.version"; do
            file="${spec%%:*}"
            path="${spec#*:}"
            jq -e "$path" "$file" >/dev/null \
              || { echo "$file has no $path — the manifest schema changed" >&2; exit 1; }
            jq --indent 2 --arg v "$version" "$path = \$v" "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done
          cd crates/cairn-lang-tree-sitter
          pnpm install --frozen-lockfile
          pnpm run generate
          cd ../..

          if [ -z "$(git status --porcelain)" ]; then
            echo "manifests already agreed with $version; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: align the non-Cargo manifests with $version"
          git push origin "$branch"

  release-patch:
    name: Publish merged release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert every copy of the version agrees before publishing
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[workspace\.package\]/   { in_section = 1; next }
            /^\[/                       { in_section = 0 }
            in_section && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [[ ! "$version" =~ ^[0-9]{4}\.(0|[1-9][0-9]*)(\.[0-9]+)?$ ]]; then
            echo "Read '$version' from [workspace.package]; that is not a CalVer number" >&2
            exit 1
          fi
          echo "Cargo [workspace.package]: $version"
          drifted=0
          compare() {
            printf '  %-48s %s\n' "$1" "$2"
            if [ "$2" != "$version" ]; then
              drifted=1
            fi
          }
          compare "crates/cairn-lang-tree-sitter/package.json" "$(jq -er '.version' crates/cairn-lang-tree-sitter/package.json)"
          compare "crates/cairn-lang-tree-sitter/tree-sitter.json" "$(jq -er '.metadata.version' crates/cairn-lang-tree-sitter/tree-sitter.json)"
          compare "editors/vscode/package.json" "$(jq -er '.version' editors/vscode/package.json)"
          while read -r name declared; do
            compare "[workspace.dependencies] $name" "$declared"
          done < <(awk '
            /^\[workspace\.dependencies\]/ { in_section = 1; next }
            /^\[/                           { in_section = 0 }
            in_section && /^cairn-[a-z-]+ = \{ version = "/ {
              declared = $0
              sub(/^.*version = "/, "", declared)
              sub(/".*$/, "", declared)
              print $1, declared
            }
          ' Cargo.toml)
          if [ "$drifted" -ne 0 ]; then
            echo 'A copy of the version disagrees with [workspace.package].' >&2
            echo 'Refusing to publish: the artefacts would carry different numbers.' >&2
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-patch
          save-if: ${{ github.ref == 'refs/heads/canary' }}

      - name: Authenticate to crates.io via OIDC
        id: cratesio-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run release-plz release
        id: release_plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}

      - name: Dispatch tag-triggered workflows for the new tag
        if: steps.release_plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --prune
          release_tag=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n1 || true)
          if [ -z "$release_tag" ]; then
            echo "release-plz reported a release but no v* tag is reachable from HEAD; skipping publish dispatch." >&2
            exit 1
          fi
          failed=()
          for wf in publish.yml tree-sitter.yml npm-publish.yml; do
            echo "Dispatching $wf for $release_tag"
            gh workflow run "$wf" -f tag="$release_tag" || failed+=("$wf")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed to dispatch: ${failed[*]}. Re-run them manually with the tag $release_tag." >&2
            exit 1
          fi

      - name: Open promote-to-main PR on release
        if: steps.release_plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --prune
          new_tags=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n1 || true)
          if [ -z "$new_tags" ]; then
            echo "release-plz reported a release but no v* tag is reachable from HEAD; refusing to promote." >&2
            exit 1
          fi
          release_tag="$new_tags"
          echo "Detected release tag reachable from HEAD: $release_tag"
          existing=$(gh pr list --base main --head canary --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            pr_number="$existing"
            echo "Reusing existing promote PR #$pr_number"
          else
            pr_number=$(gh pr create \
              --base main \
              --head canary \
              --title "chore: promote canary to main for $release_tag" \
              --body "Promote created by release.yml after release-plz published $release_tag. Approve to fire auto-merge; required status checks were already satisfied on canary." \
              | grep -oE '[0-9]+$')
            echo "Opened promote PR #$pr_number"
          fi
          gh pr merge "$pr_number" --auto --merge || echo "auto-merge could not be enabled; reviewer can merge manually"
