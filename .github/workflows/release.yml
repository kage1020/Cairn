name: Release

# Opens release PRs and (on merge) publishes.
#
# Branch model: `canary` is the trunk, `main` holds only released state.
# - Monthly minor: cron at 04:17 UTC on the 1st (offset from the hour to avoid
#   GitHub Actions cron congestion). Computes YYYY.M.0, pre-sets the workspace
#   version on canary, then runs release-plz to generate the changelog and PR.
#   This is the ONLY path that opens a release PR under the monthly cadence.
# - Push to canary: does NOT open a new release PR. It only runs `release-plz
#   release` to detect an already-merged release PR and publish + tag it. A
#   feature/fix commit landing on canary between monthly cycles is queued for
#   the next monthly PR, not turned into a patch release on the spot.
# - Manual: workflow_dispatch with optional `version` input. Same shape as the
#   monthly cron path (opens a release PR).
#
# When release-plz publishes (a release PR was merged into canary), this workflow
# detects the newly-created `v*` tag at HEAD and fast-forwards `main` to canary.
# That `v*` tag then triggers publish.yml for binaries.

on:
  schedule:
    - cron: "17 4 1 * *"
  push:
    branches: [canary]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 2026.7.0). Leave empty to compute from tags."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # Needed by the "Dispatch Publish workflow" step (`gh workflow run publish.yml`);
  # `gh` calls the workflow-dispatches REST endpoint which is gated on this scope.
  actions: write
  # Needed by `rust-lang/crates-io-auth-action` to mint an OIDC token that
  # crates.io exchanges for a short-lived, crate-scoped registry token. Without
  # this scope release-plz `release` fails with "ensure the 'id-token' permission
  # is set to 'write'" before it even reaches cargo publish.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compute-version:
    name: Compute next CalVer
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true

      - id: calc
        shell: bash
        env:
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            # Reject anything that is not a CalVer string. This is what makes
            # the downstream `sed` of Cargo.toml safe in the release-minor job.
            if [[ ! "$OVERRIDE" =~ ^[0-9]{4}\.(0|[1-9][0-9]*)(\.[0-9]+)?$ ]]; then
              echo "Refusing invalid override: $OVERRIDE" >&2
              exit 1
            fi
            echo "version=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using manual override: $OVERRIDE"
            exit 0
          fi
          year=$(date -u +%Y)
          # Unpadded month so the version is SemVer-valid (Cargo rejects a
          # leading zero in the minor position — e.g. "2026.07.0" fails to parse).
          month=$(date -u +%-m)
          prefix="v${year}.${month}"
          patches=$(git tag --list "${prefix}.*" | sed -E "s/^${prefix}\.//" | sort -n)
          if [ -z "$patches" ]; then
            version="${year}.${month}.0"
          else
            last=$(echo "$patches" | tail -n1)
            next=$((last + 1))
            version="${year}.${month}.${next}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Computed: $version"

  release-minor:
    name: Open monthly minor release PR
    if: github.event_name != 'push'
    needs: compute-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-minor
          save-if: ${{ github.ref == 'refs/heads/canary' }}

      - name: Set workspace version
        env:
          NEW_VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          # workspace.package.version (inside the [workspace.package] section).
          sed -i -E '/^\[workspace\.package\]/,/^\[/ s/^version = ".*"/version = "'"$NEW_VERSION"'"/' Cargo.toml
          # workspace.dependencies internal crate versions.
          sed -i -E 's/^(cairn-[a-z-]+ = \{ version = )"[^"]*"/\1"'"$NEW_VERSION"'"/' Cargo.toml
          cargo update --workspace
          echo "--- Cargo.toml [workspace.package] + [workspace.dependencies] ---"
          awk '/^\[workspace\.(package|dependencies)\]/,/^$/' Cargo.toml

      # The tree-sitter crate is the one workspace member that also ships to a
      # registry release-plz knows nothing about. Its npm manifest and its
      # tree-sitter manifest each carry their own copy of the version, and
      # release-plz rewrites only Cargo.toml, so without this step a CalVer bump
      # leaves the npm package advertising the previous month's number against
      # this month's grammar. tree-sitter.yml's version-sync job is what turns a
      # miss here into a red build instead of a bad publish.
      - name: Set tree-sitter package version
        env:
          NEW_VERSION: ${{ needs.compute-version.outputs.version }}
        working-directory: crates/cairn-lang-tree-sitter
        run: |
          set -euo pipefail
          # jq rather than sed: `version` is not a unique key in either file
          # once nested objects are in play, and a path expression cannot drift
          # onto a dependency's version the way a line-oriented match can.
          for spec in "package.json:.version" "tree-sitter.json:.metadata.version"; do
            file="${spec%%:*}"
            path="${spec#*:}"
            jq --indent 2 --arg v "$NEW_VERSION" "$path = \$v" "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
            echo "$file $path -> $(jq -er "$path" "$file")"
          done

      # release-pr never publishes, so no crates.io token is needed here.
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-patch:
    name: Publish merged release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-patch
          save-if: ${{ github.ref == 'refs/heads/canary' }}

      # Only `release` runs on the push path: it publishes + tags whatever
      # release PR just got merged into canary. No `release-pr` here — patch
      # PRs on every qualifying push would violate the monthly cadence, and
      # the queued commits get folded into the next monthly cron PR anyway.
      # Exchange the workflow's OIDC token for a short-lived, crate-scoped
      # crates.io token. This is the crates.io Trusted Publishing flow: each
      # cairn-lang-* crate has this repo + this workflow file registered as a
      # Trusted Publisher on crates.io, so no static `CARGO_REGISTRY_TOKEN`
      # secret is read. The token only actually gets spent by the `release`
      # sub-command below when there's something to publish.
      - name: Authenticate to crates.io via OIDC
        id: cratesio-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run release-plz release
        id: release_plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token }}

      # Auto-dispatch the tag-triggered workflows for the just-released tag. Tag
      # pushes made with GITHUB_TOKEN don't trigger `on: push: tags:` in other
      # workflows (GitHub's recursion guard), so without this step they sit idle
      # until someone runs them manually. `workflow_dispatch` explicitly bypasses
      # the recursion guard, so `gh workflow run` from inside this job fires them
      # cleanly. Same tag-detection shape as the promote step below.
      #
      # - publish.yml builds and signs the `cairn` / `cairn-lsp` binaries.
      # - tree-sitter.yml builds `tree-sitter-cairn.wasm` and attaches it to the
      #   release; the website pins that asset URL at build time.
      # - npm-publish.yml ships the same grammar to npm, so the npm package and
      #   the crates.io crate always come from one tag.
      #
      # Each is dispatched independently: a failure in one is a missing artifact
      # to re-dispatch by hand, not a reason to withhold the other two.
      - name: Dispatch tag-triggered workflows for the new tag
        if: steps.release_plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --prune
          release_tag=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n1 || true)
          if [ -z "$release_tag" ]; then
            echo "release-plz reported a release but no v* tag is reachable from HEAD; skipping publish dispatch." >&2
            exit 1
          fi
          failed=()
          for wf in publish.yml tree-sitter.yml npm-publish.yml; do
            echo "Dispatching $wf for $release_tag"
            gh workflow run "$wf" -f tag="$release_tag" || failed+=("$wf")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed to dispatch: ${failed[*]}. Re-run them manually with the tag $release_tag." >&2
            exit 1
          fi

      # Open a canary → main promote PR only when release-plz reports it
      # actually published in this run. The `releases_created` output is the
      # trust anchor — gating on "is there a v* tag at HEAD" alone would let
      # any pre-existing tag at HEAD trigger a promote.
      #
      # Direct `git push origin HEAD:refs/heads/main` is blocked by the
      # `main protection` ruleset: the GitHub Actions bot cannot be added as a
      # bypass actor on a personal (non-org) repository, so promotion has to
      # go through a PR. Auto-merge is enabled here so once the reviewer
      # approves in the UI the merge fires without further manual action;
      # required status checks are the ones canary already passed.
      - name: Open promote-to-main PR on release
        if: steps.release_plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --prune
          # `--merged HEAD` covers the release-plz merge-commit shape: the tag
          # points at the "chore: release" commit that lives on the merged-in
          # branch, and HEAD is the merge commit that pulled that branch in.
          # `--points-at HEAD` only matches tags at the exact commit and misses
          # this case, leading to a false "no v* tag points at HEAD" abort.
          new_tags=$(git tag --merged HEAD --list 'v*' --sort=-version:refname | head -n1 || true)
          if [ -z "$new_tags" ]; then
            echo "release-plz reported a release but no v* tag is reachable from HEAD; refusing to promote." >&2
            exit 1
          fi
          release_tag="$new_tags"
          echo "Detected release tag reachable from HEAD: $release_tag"
          # Reuse an already-open promote PR if the previous run left one
          # behind; `gh pr create` would otherwise error on the duplicate.
          existing=$(gh pr list --base main --head canary --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            pr_number="$existing"
            echo "Reusing existing promote PR #$pr_number"
          else
            pr_number=$(gh pr create \
              --base main \
              --head canary \
              --title "chore: promote canary to main for $release_tag" \
              --body "Fast-forward promote created by release.yml after release-plz published $release_tag. Approve to fire auto-merge; required status checks were already satisfied on canary." \
              | grep -oE '[0-9]+$')
            echo "Opened promote PR #$pr_number"
          fi
          # Best-effort auto-merge. Fails harmlessly if the PR already has
          # auto-merge on or if the repo has auto-merge disabled at the
          # settings level; the reviewer can still merge manually from the UI.
          gh pr merge "$pr_number" --auto --merge || echo "auto-merge could not be enabled; reviewer can merge manually"
