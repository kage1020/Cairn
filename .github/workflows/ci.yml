name: CI

on:
  push:
    branches: [canary, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }} / fmt + clippy + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/canary' || github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        # bash: pwsh, Windows' default, passes a step whose first command failed. `--workspace`
        # leaves out the benches, whose fixture checks run only under `--bench`.
        shell: bash
        run: |
          cargo test --workspace --locked
          cargo test -p cairn-lang-core --bench lowering
          cargo test -p cairn-lang-redstone --bench place_and_route

  lint:
    # Meant to become a required check, which matches this name literally, so keep it stable.
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/canary' || github.ref == 'refs/heads/main' }}

      - name: Repository lint
        run: cargo xtask lint

  docs:
    # Meant to become a required check, which matches this name literally, so keep it stable.
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/canary' || github.ref == 'refs/heads/main' }}

      # Only this run fires `rustdoc::private_intra_doc_links`.
      - name: Rustdoc (public items)
        run: cargo doc --workspace --no-deps --locked --all-features

      - name: Rustdoc (private items)
        run: cargo doc --workspace --no-deps --locked --all-features --document-private-items

  msrv:
    # Meant to become a required check, which matches this name literally, so keep it stable.
    name: MSRV
    runs-on: ubuntu-latest
    # CONTRIBUTING.md "Bumping the toolchain" says what this job catches.
    env:
      # Not `-D warnings`: an older compiler warns about lints the pin has since renamed.
      RUSTFLAGS: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: rustup show

      - name: Read the floor out of the manifest
        id: floor
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --format-version 1 --no-deps)
          declared=$(jq -r '[.packages[] | .rust_version // empty] | unique | join(" ")' <<<"$metadata")
          undeclared=$(jq -r '[.packages[] | select(.rust_version == null) | .name] | join(", ")' <<<"$metadata")
          if [ -z "$declared" ]; then
            echo "::error::no workspace crate declares rust-version, so there is no floor to check"
            exit 1
          fi
          if [ -n "$undeclared" ]; then
            echo "::error::these workspace crates declare no rust-version: $undeclared — give each one \`rust-version.workspace = true\` so the whole workspace shares one floor"
            exit 1
          fi
          case "$declared" in
            *\ *)
              echo "::error::workspace crates declare more than one floor ($declared) — this job can only check one"
              exit 1
              ;;
          esac
          # Cargo reads `1.95` as `1.95.0`; rustup would install the newest `1.95.x`.
          case "$declared" in
            *.*.*) ;;
            *) declared="$declared.0" ;;
          esac
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - name: Install the floor toolchain
        run: rustup toolchain install "${{ steps.floor.outputs.version }}" --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-${{ steps.floor.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/canary' || github.ref == 'refs/heads/main' }}

      - name: Check at the floor
        run: cargo +"${{ steps.floor.outputs.version }}" check --workspace --locked --all-features
