[workspace]
resolver = "2"
members = [
    "crates/cairn-lang-core",
    "crates/cairn-lang-cli",
    "crates/cairn-lang-nbt",
    "crates/cairn-lang-formats",
    "crates/cairn-lang-redstone",
    "crates/cairn-lang-lsp",
    "crates/cairn-lang-wasm",
    "crates/cairn-lang-tree-sitter",
    "xtask",
]

[workspace.package]
version = "2026.10.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/kage1020/Cairn"
homepage = "https://github.com/kage1020/Cairn"
authors = ["kage1020 and the Cairn authors"]
publish = true

[workspace.dependencies]
cairn-lang-core = { version = "2026.10.0", path = "crates/cairn-lang-core" }
cairn-lang-nbt = { version = "2026.10.0", path = "crates/cairn-lang-nbt" }
cairn-lang-formats = { version = "2026.10.0", path = "crates/cairn-lang-formats" }
cairn-lang-redstone = { version = "2026.10.0", path = "crates/cairn-lang-redstone" }
# Default features off: that drops `rayon` (parallel analysis after a
# run), `plotters` (plot rendering) and `cargo_bench_support`, which 0.8.2
# declares but never reads, so `cargo bench` and saved baselines work
# unchanged.
criterion = { version = "0.8.2", default-features = false }
flate2 = "1.1.9"
indexmap = "2.14.0"
insta = "1.48.0"
serde = "1.0.229"
serde_json = "1.0.150"
strsim = "0.11.1"
strum = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.18"

[workspace.lints.rust]
# The tree-sitter binding lowers this to `deny` in its own manifest so its FFI
# module can lift it; `cargo xtask lint` holds that exception to one module.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
# Sized for the release archives rather than build time; CI only builds this
# profile on the publish matrix.
lto = "fat"
codegen-units = 1
strip = "symbols"
# A panic aborts the shipped binaries instead of exiting 101. Tests are
# unaffected: Cargo builds test targets with unwinding regardless.
panic = "abort"
# `opt-level` is written out at the default 3 on purpose, because it is
# the one setting here that trades throughput: "s" and "z" shrink the
# gzipped binaries and slow the compiler passes, place-and-route most.
# The `lowering` and `place_and_route` benches measure that side, and
# CONTRIBUTING.md says how to rerun them before changing this.
opt-level = 3
