[workspace]
resolver = "2"
members = [
    "crates/cairn-lang-core",
    "crates/cairn-lang-cli",
    "crates/cairn-lang-nbt",
    "crates/cairn-lang-formats",
    "crates/cairn-lang-redstone",
    "crates/cairn-lang-lsp",
    "crates/cairn-lang-wasm",
    "crates/cairn-lang-tree-sitter",
]

[workspace.package]
version = "2026.9.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/kage1020/Cairn"
homepage = "https://github.com/kage1020/Cairn"
authors = ["kage1020 and the Cairn authors"]
publish = true

[workspace.dependencies]
cairn-lang-core = { version = "2026.9.2", path = "crates/cairn-lang-core" }
cairn-lang-nbt = { version = "2026.9.2", path = "crates/cairn-lang-nbt" }
cairn-lang-formats = { version = "2026.9.2", path = "crates/cairn-lang-formats" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
# Sized for the release archives rather than build time; CI only builds this
# profile on the publish matrix.
lto = "fat"
codegen-units = 1
strip = "symbols"
# A panic aborts the shipped binaries instead of exiting 101. Tests are
# unaffected: Cargo builds test targets with unwinding regardless.
panic = "abort"
# `opt-level` stays at the default 3 on purpose, because it is the one
# setting here that trades throughput. "s" and "z" shrink the gzipped
# binaries by about a fifth and a quarter; "s" slows the place-and-route
# passes by about a third, and "z" doubles block-array lowering and more
# than doubles place-and-route. The `lowering` and `place_and_route`
# benches measure that side, and CONTRIBUTING.md says how to rerun them
# before changing this.
