[workspace]
resolver = "2"
members = [
    "crates/cairn-lang-core",
    "crates/cairn-lang-cli",
    "crates/cairn-lang-nbt",
    "crates/cairn-lang-formats",
    "crates/cairn-lang-redstone",
    "crates/cairn-lang-lsp",
    "crates/cairn-lang-wasm",
    "crates/cairn-lang-tree-sitter",
]

[workspace.package]
version = "2026.9.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/kage1020/Cairn"
homepage = "https://github.com/kage1020/Cairn"
authors = ["kage1020 and the Cairn authors"]
# Publish is enabled so release-plz's monthly minor path can open a release PR;
# without this it silently no-ops (`prs:[]`) because it treats `publish = false`
# crates as intentionally excluded from crates.io release automation. The
# workflow's pre-set version step is what actually decides the CalVer number, so
# this flag being on does not cause a spurious 0.0.0 push — release-plz only
# reaches `cargo publish` when a release PR is merged with a real bumped version.
publish = true

[workspace.dependencies]
cairn-lang-core = { version = "2026.9.2", path = "crates/cairn-lang-core" }
cairn-lang-nbt = { version = "2026.9.2", path = "crates/cairn-lang-nbt" }
cairn-lang-formats = { version = "2026.9.2", path = "crates/cairn-lang-formats" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
# Tuned for the size of what actually ships: publish.yml builds `cairn` and
# `cairn-lsp` for six targets and uploads each as a `.tar.gz`/`.zip`, so the
# gzip figures below are the download, not the on-disk ones.
#
#                       cairn                cairn-lsp
#   thin, unwind    2,848,688 (gz 1,231,897)  1,460,016 (gz 643,755)
#   fat,  abort     2,464,560 (gz 1,085,777)  1,214,424 (gz 544,791)
#                      -13.5% (gz    -11.9%)     -16.8% (gz  -15.4%)
#
# `fat` over `thin` costs release build time and nothing else; ci.yml builds and
# tests the dev profile only, so the extra minutes land on publish.yml, which is
# already a six-way matrix that runs once per tag.
lto = "fat"
codegen-units = 1
strip = "symbols"
# Unwinding exists here only to be caught by tests: 30 `#[should_panic]` cases
# across `cairn-lang-redstone` / `cairn-lang-core`, plus the `catch_unwind`
# helper in `placement_ir.rs` that reads a transition's panic payload back. None
# of them run in this profile — ci.yml runs `cargo test --workspace` on the dev
# profile, where unwinding stays on — so the landing pads are dead weight in a
# release binary that has no `catch_unwind` on any live path.
#
# The trade is that `cargo test --release` aborts instead of reporting those
# tests. Nothing in .github/workflows or CONTRIBUTING invokes it; run the tests
# on the dev profile (`cargo test --workspace`), which is what CI asserts.
panic = "abort"
