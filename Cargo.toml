[workspace]
resolver = "2"
members = [
    "crates/cairn-lang-core",
    "crates/cairn-lang-cli",
    "crates/cairn-lang-nbt",
    "crates/cairn-lang-formats",
    "crates/cairn-lang-redstone",
    "crates/cairn-lang-lsp",
    "crates/cairn-lang-wasm",
    "crates/cairn-lang-tree-sitter",
    "website",
    "xtask",
]

[workspace.package]
version = "2026.10.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/kage1020/Cairn"
homepage = "https://github.com/kage1020/Cairn"
authors = ["kage1020 and the Cairn authors"]
publish = true

[workspace.dependencies]
cairn-lang-core = { version = "2026.10.0", path = "crates/cairn-lang-core" }
cairn-lang-docs = { version = "2026.10.0", path = "website" }
cairn-lang-nbt = { version = "2026.10.0", path = "crates/cairn-lang-nbt" }
cairn-lang-formats = { version = "2026.10.0", path = "crates/cairn-lang-formats" }
cairn-lang-redstone = { version = "2026.10.0", path = "crates/cairn-lang-redstone" }
# Default features off drops `rayon` and `plotters`; `cargo bench` and saved baselines still work.
criterion = { version = "0.8.2", default-features = false }
flate2 = "1.1.9"
indexmap = "2.14.0"
insta = "1.48.0"
serde = "1.0.229"
serde_json = "1.0.150"
strsim = "0.11.1"
strum = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.18"

[workspace.lints.rust]
# The tree-sitter binding lowers this to `deny` so its `ffi` module can lift it.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
# Sized for the release archives.
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
# Not "s" or "z": they slow place-and-route. CONTRIBUTING.md "Changing the release profile" says
# how to measure a change.
opt-level = 3
