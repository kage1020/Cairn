[package]
name = "cairn-lang-cli"
description = "Command-line interface for the Cairn language"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-lang-core.workspace = true
cairn-lang-formats.workspace = true
cairn-lang-redstone.workspace = true
# clap's default features stay on deliberately; they are the obvious
# thing to cut when shrinking the binary. Of the six, three are the reason
# for this note (`std`, `help` and `usage` are the rest, and losing `help`
# would be louder still). `error-context` names a mistyped flag,
# "unexpected argument '--editon' found", and `suggestions` adds "a
# similar argument exists: '--edition'": the same answer the compiler
# gives a mistyped `key=`. `suggestions` pulls `error-context` in, so the
# two go together. `color` styles `--help` and the error headings.
# `tests/cli/contract/usage.rs` fails if the first two go.
clap = { version = "4.6.1", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
flate2.workspace = true
tempfile.workspace = true
