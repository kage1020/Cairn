[package]
name = "cairn-lang-cli"
description = "Command-line interface for the Cairn language"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-lang-core = { workspace = true }
cairn-lang-formats.workspace = true
cairn-lang-redstone = { version = "2026.9.2", path = "../cairn-lang-redstone" }
# clap's default features stay on deliberately; they are the obvious
# thing to cut when shrinking the binary. `error-context` and `suggestions`
# answer a mistyped flag with "unexpected argument '--editon' found" and
# "a similar argument exists: '--edition'", which is the what is wrong /
# nearest candidate shape every Cairn diagnostic takes, and `color` styles
# `--help` and the error headings. `tests/cli_mistyped_flag.rs` fails if
# the first two go.
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true

[dev-dependencies]
flate2 = "1.1.9"
tempfile = "3.27.0"
