[package]
name = "cairn-lang-cli"
description = "Command-line interface for the Cairn language"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-lang-core.workspace = true
cairn-lang-docs.workspace = true
cairn-lang-formats.workspace = true
cairn-lang-redstone.workspace = true
# Keep clap's default features: `error-context` and `suggestions` name a mistyped flag and the
# nearest valid one, which `tests/cli/contract/usage.rs` pins.
clap = { version = "4.6.1", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
flate2.workspace = true
tempfile.workspace = true
