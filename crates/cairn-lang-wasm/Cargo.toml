[package]
name = "cairn-lang-wasm"
description = "WebAssembly bindings that run the Cairn compiler in the browser"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cairn-lang-core.workspace = true
cairn-lang-formats.workspace = true
js-sys = "0.3.106"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

[dev-dependencies]
flate2.workspace = true
wasm-bindgen-test = "0.3.79"

[lints]
workspace = true

# wasm-pack would download `wasm-opt` for a pass that saves about 5% of this module, and nothing
# once it is gzipped.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
