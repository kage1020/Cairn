[workspace]
semver_check = false

git_tag_enable = false
git_release_enable = false

changelog_path = "./CHANGELOG.md"
changelog_update = true

allow_dirty = true
publish_allow_dirty = true
publish_timeout = "10m"

release_commits = "^(feat|fix|perf|refactor|build)(\\(.+\\))?(!)?:"

pr_branch_prefix = "release-plz-"
pr_labels = ["release"]

[[package]]
name = "cairn-lang-cli"
publish = true
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
# GitHub refuses a release body over 125,000 characters with a bare 422, after
# the crates are already on crates.io. A month whose entry outgrows that links
# to the CHANGELOG at the tag instead of failing the release.
git_release_body = """
{%- if changelog | length > 120000 -%}
This release's changelog entry is too long for a GitHub release body.
Read it in [CHANGELOG.md at v{{ version }}](https://github.com/kage1020/Cairn/blob/v{{ version }}/CHANGELOG.md).
{%- else -%}
{{ changelog }}
{%- endif -%}
"""

[changelog]
header = """# Changelog

## [Unreleased]

"""

body = """
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- *({{ commit.scope }})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor %}
"""

protect_breaking_commits = true

commit_parsers = [
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^perf", group = "performance" },
  { message = "^refactor", group = "changed" },
  { message = "^docs", group = "docs", skip = true },
  { message = "^build", group = "build" },
  { message = "^ci", group = "ci", skip = true },
  { message = "^test", group = "test", skip = true },
  { message = "^style", group = "style", skip = true },
  { message = "^chore(\\(release\\))?: release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "chore", skip = true },
  { message = "^.*", group = "other" },
]
